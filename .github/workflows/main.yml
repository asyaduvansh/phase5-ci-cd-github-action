name: DevGuard Pro - Full CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: devguard-pro
  PYTHON_VERSION: '3.11'

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - run: pytest tests/ -v

  build-and-push:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  deploy-to-k8s:
    name: Deploy to Kubernetes
    runs-on: self-hosted          # ← SELF-HOSTED RUNNER!
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify cluster connection
        run: |
          echo "═══════════════════════════════════"
          echo "Checking cluster access..."
          kubectl get nodes
          echo "═══════════════════════════════════"

      - name: Delete old job (if exists)
        run: |
          kubectl delete job devguard-job --ignore-not-found
          echo "Old job cleaned up"

      - name: Apply new job
        run: |
          kubectl apply -f k8s/devguard-job.yaml
          echo "New job created"

      - name: Wait for job completion
        run: |
          echo "Waiting for job to complete..."
          kubectl wait --for=condition=complete --timeout=120s job/devguard-job
          echo "Job completed successfully!"

      - name: Show job logs
        run: |
          echo "═══════════════════════════════════"
          echo "JOB LOGS:"
          echo "═══════════════════════════════════"
          kubectl logs job/devguard-job

      - name: Deployment summary
        if: success()
        run: |
          echo "═══════════════════════════════════"
          echo "✅ DEPLOYMENT SUCCESSFUL!"
          echo "═══════════════════════════════════"
          echo "Image: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest"
          echo "Cluster: $(kubectl config current-context)"
          echo "Triggered by: ${{ github.actor }}"
          echo "═══════════════════════════════════"
