name: DevGuard Pro - Production CI Pipeline

# Trigger: jab bhi main pe push ho
on:
  push:
    branches:
      - main

# Environment variables (poore workflow ke liye)
env:
  IMAGE_NAME: devguard-pro
  PYTHON_VERSION: '3.11'

jobs:

  # ════════════════════════════════════════════
  # JOB 1: TEST
  # Code verify karo — pehla gatekeeper
  # ════════════════════════════════════════════
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: pytest tests/ -v

      - name: Test summary
        if: success()
        run: echo "All tests passed! Ready to build."

  # ════════════════════════════════════════════
  # JOB 2: BUILD
  # Sirf agar tests pass hue
  # ════════════════════════════════════════════
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:test .
          echo "Image built successfully"

      - name: Verify image works
        run: |
          docker images | grep ${{ env.IMAGE_NAME }}
          echo "Image verification passed"

      - name: Build summary
        if: success()
        run: echo "Docker image built. Ready to push."

  # ════════════════════════════════════════════
  # JOB 3: PUSH
  # Sirf agar build pass hua
  # ════════════════════════════════════════════
  push:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push with multiple tags
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Pipeline success summary
        if: success()
        run: |
          echo "═══════════════════════════════════════"
          echo "PIPELINE SUCCESS"
          echo "═══════════════════════════════════════"
          echo "Image: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}"
          echo "Tags: latest, ${{ github.sha }}"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "═══════════════════════════════════════"
          echo ""
          echo "Pull command:"
          echo "docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest"

