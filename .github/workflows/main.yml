name: DevGuard Pro · Full CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:        # Manual trigger button bhi

env:
  IMAGE_NAME: devguard-pro
  PYTHON_VERSION: '3.11'

jobs:

  # ═══════════════════════════════════════════════════
  # JOB 1 · TESTS
  # ═══════════════════════════════════════════════════
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: pytest tests/ -v

      - name: Test summary
        if: success()
        run: echo "✅ All tests passed — ready to build"

  # ═══════════════════════════════════════════════════
  # JOB 2 · BUILD + PUSH
  # ═══════════════════════════════════════════════════
  build-and-push:
    name: 🐳 Build and Push Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push with dual tags
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Build summary
        if: success()
        run: |
          echo "✅ Image built and pushed successfully"
          echo "📦 Tags:"
          echo "   • ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest"
          echo "   • ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

  # ═══════════════════════════════════════════════════
  # JOB 3 · DEPLOY TO K8S
  # ═══════════════════════════════════════════════════
  deploy-to-k8s:
    name: 🚀 Deploy to Kubernetes
    runs-on: self-hosted
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pre-flight cluster check
        run: |
          echo "═══════════════════════════════════════"
          echo "🔍 PRE-FLIGHT CHECKS"
          echo "═══════════════════════════════════════"
          echo "Cluster context: $(kubectl config current-context)"
          echo ""
          echo "Cluster nodes:"
          kubectl get nodes
          echo ""
          echo "Current jobs in cluster:"
          kubectl get jobs || echo "(no jobs)"
          echo "═══════════════════════════════════════"

      - name: Prepare job manifest with SHA tag
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "🏷️  Injecting image tag: $IMAGE"
          sed -i "s|IMAGE_PLACEHOLDER|$IMAGE|g" k8s/devguard-job.yaml
          echo ""
          echo "───── Final Job Manifest ─────"
          cat k8s/devguard-job.yaml
          echo "──────────────────────────────"

      - name: Clean up previous job
        run: |
          echo "🧹 Cleaning up previous job..."
          kubectl delete job devguard-job --ignore-not-found
          echo "✅ Cleanup complete"

      - name: Deploy new job
        run: |
          echo "🚀 Applying new job manifest..."
          kubectl apply -f k8s/devguard-job.yaml
          echo "✅ Job created"

      - name: Wait for job to complete
        run: |
          echo "⏳ Waiting for job to complete (timeout: 120s)..."
          kubectl wait --for=condition=complete \
            --timeout=120s \
            job/devguard-job
          echo "✅ Job completed successfully"

      - name: Show pod details
        run: |
          echo "═══════════════════════════════════════"
          echo "📊 POD DETAILS"
          echo "═══════════════════════════════════════"
          kubectl get pods -l job-name=devguard-job
          echo "═══════════════════════════════════════"

      - name: Show application logs
        run: |
          echo "═══════════════════════════════════════"
          echo "📜 APPLICATION OUTPUT"
          echo "═══════════════════════════════════════"
          kubectl logs job/devguard-job
          echo "═══════════════════════════════════════"

      - name: Deployment summary
        if: success()
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════"
          echo "🎉  DEPLOYMENT SUCCESSFUL"
          echo "═══════════════════════════════════════════════════"
          echo "📦 Image:      ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "🏷️  Commit:     ${{ github.sha }}"
          echo "👤 Author:     ${{ github.actor }}"
          echo "🌿 Branch:     ${{ github.ref_name }}"
          echo "⏰ Run ID:     ${{ github.run_id }}"
          echo "🎯 Cluster:    $(kubectl config current-context)"
          echo "═══════════════════════════════════════════════════"

      - name: Failure diagnostics
        if: failure()
        run: |
          echo "═══════════════════════════════════════"
          echo "❌ DEPLOYMENT FAILED"
          echo "═══════════════════════════════════════"
          echo "Pods status:"
          kubectl get pods -l job-name=devguard-job || true
          echo ""
          echo "Job description:"
          kubectl describe job devguard-job || true
          echo ""
          echo "Pod logs (if any):"
          kubectl logs job/devguard-job --tail=50 || true
          echo "═══════════════════════════════════════"
