name: DevGuard Pro · Full CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:        # Manual trigger button bhi

env:
  IMAGE_NAME: devguard-pro
  PYTHON_VERSION: '3.11'

jobs:

  # ═══════════════════════════════════════════════════
  # JOB 1 · TEST
  # ═══════════════════════════════════════════════════
  test:
    name: 🧪 Run Tests with Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --junit-xml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml
          retention-days: 30

      - name: Test summary
        if: success()
        run: |
          echo "═══════════════════════════════════════"
          echo "✅ ALL TESTS PASSED"
          echo "═══════════════════════════════════════"
          echo "📊 Coverage report uploaded as artifact"
          echo "📁 JUnit XML uploaded for analysis"
  # ═══════════════════════════════════════════════════
  # JOB 2 · BUILD + PUSH
  # ═══════════════════════════════════════════════════
  build-and-push:
    name: 🐳 Build and Push Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push with dual tags
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Build summary
        if: success()
        run: |
          echo "✅ Image built and pushed successfully"
          echo "📦 Tags:"
          echo "   • ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest"
          echo "   • ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

  security-scan:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'    # Don't fail build for now (preview mode)

      - name: Run Trivy with detailed output
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          exit-code: '0'

      - name: Upload Trivy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.json
          retention-days: 30

      - name: Security summary
        if: success()
        run: |
          echo "═══════════════════════════════════════"
          echo "🛡️ SECURITY SCAN COMPLETE"
          echo "═══════════════════════════════════════"
          echo "📦 Image scanned:"
          echo "   ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo ""
          echo "📊 Detailed JSON report uploaded as artifact"
          echo ""
          echo "ℹ️  PREVIEW MODE: Build will not fail on vulnerabilities"
          echo "    In production: Critical vulnerabilities should block deploy"
          echo "═══════════════════════════════════════"

  # ═══════════════════════════════════════════════════
  # JOB 3 · DEPLOY TO K8S
  # ═══════════════════════════════════════════════════
  deploy-to-k8s:
    name: 🚀 Deploy to Kubernetes
    runs-on: self-hosted
    needs: [build-and-push, security-scan]
    # ↓ NAYA — environment specify karo
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "namespace=prod" >> $GITHUB_OUTPUT
            echo "env_name=production" >> $GITHUB_OUTPUT
            echo "🎯 Target: PRODUCTION"
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "namespace=dev" >> $GITHUB_OUTPUT
            echo "env_name=development" >> $GITHUB_OUTPUT
            echo "🔧 Target: DEVELOPMENT"
          else
            echo "❌ Unknown branch — skipping deployment"
            exit 1
          fi

      - name: Pre-flight cluster check
        run: |
          echo "═══════════════════════════════════════"
          echo "🔍 PRE-FLIGHT CHECKS"
          echo "═══════════════════════════════════════"
          echo "Cluster: $(kubectl config current-context)"
          echo "Target namespace: ${{ steps.env.outputs.namespace }}"
          echo "Environment: ${{ steps.env.outputs.env_name }}"
          echo ""
          kubectl get nodes
          echo "═══════════════════════════════════════"

      - name: Prepare manifest with dynamic values
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          NAMESPACE="${{ steps.env.outputs.namespace }}"
          ENV_NAME="${{ steps.env.outputs.env_name }}"
          
          echo "🏷️  Image: $IMAGE"
          echo "📦 Namespace: $NAMESPACE"
          echo "🌍 Environment: $ENV_NAME"
          
          sed -i "s|IMAGE_PLACEHOLDER|$IMAGE|g" k8s/devguard-job.yaml
          sed -i "s|NAMESPACE_PLACEHOLDER|$NAMESPACE|g" k8s/devguard-job.yaml
          sed -i "s|ENV_PLACEHOLDER|$ENV_NAME|g" k8s/devguard-job.yaml
          
          echo ""
          echo "───── Final Manifest ─────"
          cat k8s/devguard-job.yaml
          echo "──────────────────────────"

      - name: Clean up old job
        run: |
          kubectl delete job devguard-job \
            -n ${{ steps.env.outputs.namespace }} \
            --ignore-not-found
          echo "✅ Cleanup complete"

      - name: Deploy new job
        run: |
          kubectl apply -f k8s/devguard-job.yaml
          echo "✅ Job deployed to ${{ steps.env.outputs.namespace }}"

      - name: Wait for completion
        run: |
          kubectl wait --for=condition=complete \
            --timeout=120s \
            -n ${{ steps.env.outputs.namespace }} \
            job/devguard-job

      - name: Show pod logs
        run: |
          echo "═══════════════════════════════════════"
          echo "📜 LOGS FROM ${{ steps.env.outputs.env_name }}"
          echo "═══════════════════════════════════════"
          kubectl logs -n ${{ steps.env.outputs.namespace }} job/devguard-job

      - name: Deployment summary
        if: success()
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════"
          echo "🎉  DEPLOYED TO ${{ steps.env.outputs.env_name }}"
          echo "═══════════════════════════════════════════════════"
          echo "📦 Image:       ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "🌍 Environment: ${{ steps.env.outputs.env_name }}"
          echo "📂 Namespace:   ${{ steps.env.outputs.namespace }}"
          echo "🌿 Branch:      ${{ github.ref_name }}"
          echo "👤 Author:      ${{ github.actor }}"
          echo "═══════════════════════════════════════════════════"

      - name: Failure diagnostics
        if: failure()
        run: |
          NS=${{ steps.env.outputs.namespace }}
          kubectl get pods -n $NS -l job-name=devguard-job || true
          kubectl describe job devguard-job -n $NS || true
          kubectl logs job/devguard-job -n $NS --tail=50 || true
