# ═══════════════════════════════════════════════════════════════
# DevGuard Pro — Production CI/CD Pipeline
# ═══════════════════════════════════════════════════════════════
# Phase 5 Capstone: Full automated pipeline with:
#   ✓ Multi-environment deployment (dev/prod)
#   ✓ Test coverage tracking
#   ✓ Vulnerability scanning (Trivy)
#   ✓ Production approval gates
#   ✓ Rollout verification
#   ✓ Failure diagnostics
# ═══════════════════════════════════════════════════════════════

name: DevGuard Pro · Production CI/CD

on:
  push:
    branches:
      - main          # → Production deployment (with approval)
      - develop       # → Development deployment (auto)
  workflow_dispatch:  # → Manual trigger button

env:
  IMAGE_NAME: devguard-pro
  PYTHON_VERSION: '3.11'

jobs:

  # ─────────────────────────────────────────────────────────────
  # JOB 1 · TEST + COVERAGE
  # Runs unit tests and measures code coverage
  # ─────────────────────────────────────────────────────────────
  test:
    name: 🧪 Test + Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --junit-xml=test-results.xml

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # JOB 2 · BUILD + PUSH IMAGE
  # Builds Docker image with dual tagging strategy
  # ─────────────────────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build + Push Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push with dual tags
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Image summary
        run: |
          echo "✅ Pushed: ${{ env.IMAGE_NAME }}:latest"
          echo "✅ Pushed: ${{ env.IMAGE_NAME }}:${{ github.sha }}"

  # ─────────────────────────────────────────────────────────────
  # JOB 3 · SECURITY SCAN
  # Scans image for known vulnerabilities (CVEs)
  # ─────────────────────────────────────────────────────────────
  security-scan:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trivy vulnerability scan (table)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Trivy detailed report (JSON)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          exit-code: '0'

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # JOB 4 · DEPLOY TO KUBERNETES
  # Deploys to dev or prod based on branch
  # ─────────────────────────────────────────────────────────────
  deploy-to-k8s:
    name: 🚀 Deploy to Kubernetes
    runs-on: self-hosted
    needs: [build-and-push, security-scan]
    
    # Environment determines approval rules
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine target environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "namespace=prod" >> $GITHUB_OUTPUT
            echo "env_name=production" >> $GITHUB_OUTPUT
            echo "🎯 Target: PRODUCTION"
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "namespace=dev" >> $GITHUB_OUTPUT
            echo "env_name=development" >> $GITHUB_OUTPUT
            echo "🔧 Target: DEVELOPMENT"
          fi

      - name: Pre-flight cluster check
        run: |
          echo "═══════════════════════════════════════"
          echo "Cluster:     $(kubectl config current-context)"
          echo "Namespace:   ${{ steps.env.outputs.namespace }}"
          echo "Environment: ${{ steps.env.outputs.env_name }}"
          echo "═══════════════════════════════════════"
          kubectl get nodes

      - name: Prepare manifest with dynamic values
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          NAMESPACE="${{ steps.env.outputs.namespace }}"
          ENV_NAME="${{ steps.env.outputs.env_name }}"
          
          sed -i "s|IMAGE_PLACEHOLDER|$IMAGE|g" k8s/devguard-job.yaml
          sed -i "s|NAMESPACE_PLACEHOLDER|$NAMESPACE|g" k8s/devguard-job.yaml
          sed -i "s|ENV_PLACEHOLDER|$ENV_NAME|g" k8s/devguard-job.yaml

      - name: Clean up previous job
        run: |
          kubectl delete job devguard-job \
            -n ${{ steps.env.outputs.namespace }} \
            --ignore-not-found

      - name: Deploy job
        run: kubectl apply -f k8s/devguard-job.yaml

      - name: Wait for completion
        run: |
          kubectl wait --for=condition=complete \
            --timeout=120s \
            -n ${{ steps.env.outputs.namespace }} \
            job/devguard-job

      - name: Show application logs
        run: |
          echo "═══════════════════════════════════════"
          kubectl logs -n ${{ steps.env.outputs.namespace }} job/devguard-job
          echo "═══════════════════════════════════════"

      - name: Deployment summary
        if: success()
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════"
          echo "🎉  DEPLOYED TO ${{ steps.env.outputs.env_name }}"
          echo "═══════════════════════════════════════════════════"
          echo "📦 Image:       ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "🌍 Environment: ${{ steps.env.outputs.env_name }}"
          echo "📂 Namespace:   ${{ steps.env.outputs.namespace }}"
          echo "🌿 Branch:      ${{ github.ref_name }}"
          echo "👤 Author:      ${{ github.actor }}"
          echo "🔗 Commit:      ${{ github.sha }}"
          echo "═══════════════════════════════════════════════════"

      - name: Failure diagnostics
        if: failure()
        run: |
          NS=${{ steps.env.outputs.namespace }}
          echo "❌ DEPLOYMENT FAILED — Diagnostics below"
          kubectl get pods -n $NS -l job-name=devguard-job || true
          kubectl describe job devguard-job -n $NS || true
          kubectl logs job/devguard-job -n $NS --tail=50 || true
