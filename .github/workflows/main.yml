name: DevGuard CI - Docker Build

on:
  push:
    branches:
      - main

jobs:
  build-image:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show files in workspace
        run: ls -la

      - name: Verify Dockerfile exists
        run: |
          if [ -f Dockerfile ]; then
            echo "Dockerfile found!"
            cat Dockerfile
          else
            echo "ERROR: Dockerfile not found!"
            exit 1
          fi

      - name: Build Docker image
        run: docker build -t devguard-pro:ci-test .

      - name: Show built images
        run: docker images

      - name: Success message
        run: echo "Docker image built successfully in CI!"
